name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and lint
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:lintDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "CodexHarnessMobile-${GITHUB_REF_NAME#v}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CodexHarnessMobile-*.apk
